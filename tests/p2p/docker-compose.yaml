version: '3.8'

networks:
  btfy-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  node-a:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: btfy-node-a
    command: >
      btfy
      --api-port 8080
      --p2p-port 62697
      --beacon-cmd temperature.sh
      --mining
    ports:
      - "8080:8080"
      - "62697:62697"
    networks:
      btfy-net:
        ipv4_address: 172.28.0.2

  node-b:
    build:
      context: ../..
      dockerfile: Dockerfile
    container_name: btfy-node-b
    command: >
      btfy
      --api-port 8080
      --p2p-port 62698
      --beacon-cmd temperature.sh
    ports:
      - "8081:8080"
      - "62698:62698"
    networks:
      btfy-net:
        ipv4_address: 172.28.0.3
