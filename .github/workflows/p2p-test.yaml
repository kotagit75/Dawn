name: P2P Integration Test

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  p2p-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run P2P integration test
        run: bash tests/p2p/inspect.sh
        working-directory: ./

      - name: Dump node logs on failure
        if: failure()
        run: |
          echo "=== node-a logs ==="
          docker logs btfy-node-a || true
          echo "=== node-b logs ==="
          docker logs btfy-node-b || true

      - name: Cleanup containers
        if: always()
        run: docker compose -f tests/p2p/docker-compose.yaml down -v --remove-orphans || true
